name: Deploy Prod to Tencent Cloud
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            id-token: write
            attestations: write
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v6
            -   name: Install pnpm
                uses: pnpm/action-setup@v5
                with:
                    version: "latest"
            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    cache: "pnpm"
                    cache-dependency-path: "pnpm-lock.yaml"
                    registry-url: 'https://registry.npmjs.org'
            -   name: Install Dependencies
                env:
                    NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PNPM_CONFIG_NPMRC_AUTH_FILE: .npmrc
                run: pnpm i
            -   name: Build
                run: |
                    pnpm check
                    pnpm build
                    zip -r build.zip build/
            -   name: Attest Build Provenance
                uses: actions/attest-build-provenance@v3
                with:
                    subject-path: ./build.zip
            -   name: Pack Artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: build-${{ github.run_id }}
                    path: |
                        ./build.zip
                        ./build.zip.intoto.jsonl
            -   name: Deploy to Server
                uses: Burnett01/rsync-deployments@7.1.0
                with:
                    remote_key: ${{ secrets.TENCENT_CLOUD_SSH_PRIVATE_KEY }}
                    remote_host: ${{ secrets.TENCENT_CLOUD_REMOTE_HOST }}
                    remote_user: ${{ secrets.TENCENT_CLOUD_REMOTE_USER }}
                    remote_path: ${{ secrets.TENCENT_CLOUD_DEPLOY_TARGET }}
                    path: build/
                    switches: -avzr --delete
    dispatch:
        needs: deploy
        runs-on: ubuntu-latest
        env:
            SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
            SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        steps:
            -   name: pip Cache
                uses: actions/cache@v4
                id: cache
                with:
                    path: ~/.cache/pip
                    key: ${{ runner.os }}-pip-deploy-prod
            -   name: Install tccli
                run: pip install tccli
            -   name: Authenticate With Tencent Cloud CLI
                run: tccli configure set secretId $SECRET_ID secretKey $SECRET_KEY
            -   name: Purge Tencent Cloud CDN Cache
                run: tccli cdn PurgePathCache --Paths "$(echo '${{ vars.DEPLOY_CDN_PURGE_URLS }}')" --FlushType "delete"
